name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate pre-built APK and checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH does not exist." >&2
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty." >&2
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "Error: $SHA_PATH is missing or empty." >&2
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          unzip -tq "$APK_PATH"

          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SIZE_HUMAN=$(du -h "$APK_PATH" | awk '{print $1}')
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_SIZE_HUMAN}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
        run: |
          set -euo pipefail

          RELEASE_NOTES=$(cat <<EOF
          Pre-built Android Debug APK compiled inside Google AI Studio.

          - **Asset:** \`app-debug.apk\`
          - **Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          - **SHA-256:** \`${APK_SHA256}\`
          EOF
          )

          RELEASE_URL=$(gh release create "${RELEASE_TAG}" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --title "Debug APK (${RELEASE_TAG})" \
            --notes "${RELEASE_NOTES}" \
            --latest)

          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euo pipefail

          DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          {
            echo "## Android Debug APK Published"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **Release Page:** ${RELEASE_URL}"
            echo "- **Direct Latest APK Download:** ${DIRECT_DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
